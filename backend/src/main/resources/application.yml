server:
  port: ${PORT:8080}

spring:
  application:
    name: url-shortener
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configurations
app:
  jwt:
    secret: 9a4f2c8d3b7a1e5f8g0h2i4j6k8l0m2n4o6p8q0r2s4t6u8v0w2x4y6z8A0B2C4D
    expiration-ms: 86400000 # 1 day in milliseconds
    refresh-expiration-ms: 604800000 # 7 days in milliseconds
  upload:
    dir: uploads
  frontend-url: ${FRONTEND_URL:https://trimrr-urlshortner.vercel.app}
